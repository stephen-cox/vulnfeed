version: 2

updates:
  # A project that tracks security advisories should be watching its own
  # dependencies; nothing was bumping these pinned versions.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
