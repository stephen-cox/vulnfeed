name: Update security feed

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Serialise runs so a manual dispatch overlapping the nightly schedule cannot
# race it to push, which would fail the second one on a non-fast-forward.
# Scheduled runs must not be cancelled by a manual one.
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: python -m pytest tests/ -v

  build-index:
    needs: [checks]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate index from the published feed
        run: python vulnfeed.py --index-only

      - name: Commit index if changed
        run: |
          git add public/index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate index.html"
          git push

      - name: Upload site for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  update-feed:
    needs: [checks]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate feed and index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python vulnfeed.py

      - name: Commit and push if changed
        run: |
          git add public/feed.xml public/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated security feed"
          git push

      - name: Upload site for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: [build-index, update-feed]
    if: |
      always() && !cancelled() &&
      (needs.build-index.result == 'success' || needs.update-feed.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploys the artifact uploaded by whichever job ran. Previously this
      # checked out main and pulled, racing the commit it was meant to publish.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
