[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["vulnfeed.py", "sources"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
