site:
  url: https://stephen-cox.github.io/vulnfeed
  github: https://github.com/stephen-cox/vulnfeed

feed:
  # Most recent advisories to publish. Subscribers re-download the whole
  # feed on every poll, so this bounds it.
  max_items: 100
  # Optional: also drop anything published longer ago than this.
  # max_age_days: 365

feeds:
  - source: github
    repos:
      - argoproj/argo-cd
      - composer/composer
      - espocrm/espocrm
      - icinga/icinga2
      - mautic/mautic
      - open-webui/open-webui
      - RocketChat/Rocket.Chat
      - taigaio/taiga-back
      - taigaio/taiga-events
      - taigaio/taiga-front
      - WordPress/wordpress-develop
      - zammad/zammad
